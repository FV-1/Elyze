# Sortir une version : pousser un tag, le reste suit.
#
#   1. Monter la version (ex. 1.2.0) dans app.json ("version") ET dans
#      src/data/appInfo.ts (APP_VERSION, qui en est une copie, et qu'un test
#      compare à app.json), commiter, pousser sur main.
#   2. git tag v1.2.0 && git push origin v1.2.0
#
# Ce workflow vérifie alors le code, fait construire l'APK Android par EAS,
# puis publie une Release GitHub qui porte l'APK et la liste des changements
# depuis le tag précédent.
#
# Le tag et app.json doivent dire la même version. Sinon on s'arrête avant le
# build : une Release « v1.2.0 » dont l'app se déclare 1.1.0 dans les réglages
# du téléphone laisserait les testeurs sans moyen de savoir ce qu'ils ont.
#
# Prérequis : le secret EXPO_TOKEN (expo.dev > Account settings > Access
# tokens), ajouté dans Settings > Secrets and variables > Actions du dépôt.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Deux tags poussés coup sur coup ne se marchent pas dessus.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # La file d'attente EAS du plan gratuit peut dépasser la demi-heure.
    timeout-minutes: 120
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tout l'historique, pour que les notes de version trouvent le tag
          # précédent.
          fetch-depth: 0

      - name: Le tag correspond à app.json
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Le tag $TAG ne correspond pas à la version $VERSION d'app.json. Monte la version dans app.json, ou tague v$VERSION."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les mêmes contrôles qu'en local : une version ne sort pas si l'un
      # d'eux échoue.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run check-data

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Construire l'APK
        run: |
          eas build --platform android --profile release --non-interactive --wait --json > build.json
          URL=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          curl -fsSL -o "Elyze-$TAG.apk" "$URL"

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "Elyze-$TAG.apk" \
            --title "Élyze $TAG" \
            --generate-notes \
            --verify-tag
